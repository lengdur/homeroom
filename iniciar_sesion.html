<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(214, 182, 71, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(214, 182, 71, 0.05) 1px, transparent 1px),
          linear-gradient(135deg, #fff9dc 0%, #fff1b8 35%, #fdf2d5 100%);
        background-size: 28px 28px, 28px 28px, 100% 100%;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      .login-box {
        width: min(90vw, 430px);
        background: rgba(255, 255, 255, 0.78);
        border: 2px solid #efd88b;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(150, 128, 50, 0.12), inset 0 0 0 2px rgba(255,255,255,0.5);
        padding: 32px 26px 22px;
        position: relative;
      }

      .login-box::before {
        content: "";
        position: absolute;
        inset: 10px 12px 10px 12px;
        border: 1px solid rgba(188, 153, 70, 0.3);
        border-radius: 12px;
        pointer-events: none;
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        color: #7a6729;
        margin: 0 0 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: #7a6729;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 2px solid #f2d778;
        background: #fffdf5;
        font-size: 1rem;
        margin-bottom: 18px;
        outline: none;
      }

      input:focus {
        border-color: #e7c65a;
        box-shadow: 0 0 0 4px rgba(231, 198, 90, 0.18);
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #f7e7a1, #f3d76f);
        color: #655123;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 18px rgba(214, 182, 71, 0.22);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .crear-cuenta {
        margin-top: 18px;
        text-align: center;
        font-size: 0.9rem;
        color: #7a6729;
      }

      .crear-cuenta a {
        color: #9a7d1b;
        font-weight: 700;
        text-decoration: none;
      }

      .crear-cuenta a:hover {
        text-decoration: underline;
      }

      @media (max-width: 420px) {
        body { padding: 12px; }
        .login-box { width: 100%; padding: 28px 18px 20px; }
        h1 { font-size: 1.7rem; }
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <h1>Iniciar sesión</h1>

      <form id="loginForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="correo@ejemplo.com" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" required />

        <button type="submit">Entrar</button>
      </form>

      <div class="crear-cuenta">
        <span>¿No tienes cuenta? </span>
        <a href="crear_cuenta.html">Crear cuenta</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script>

      const loginForm = document.getElementById('loginForm');

      loginForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
          showNotification('Completa todos los campos.', 'error');
          return;
        }

        try {
          const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;

          const profile = await getCurrentProfile();
          window.location.href = profile?.rango === 'admin' ? 'admin.html' : 'inicio.html';
        } catch (error) {
          if (error.code === '42P01' || error.message?.includes('relation "public.usuarios" does not exist')) {
            showNotification('Falta la tabla usuarios. Ejecuta inutiles/supabase-schema.sql completo en el SQL Editor del proyecto jtfqkiwfyynysyqrvmjz.', 'error');
            return;
          }
          if (error.message === 'Invalid login credentials') {
            showNotification('Supabase no reconoce estas credenciales. Si la cuenta existía antes de esta migración, ejecuta inutiles/migrar-usuarios-a-auth.sql en Supabase o crea una cuenta nueva.', 'error');
            return;
          }
          showNotification(error.message || 'Error al iniciar sesión.', 'error');
        }
      });
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
