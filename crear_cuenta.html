<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(214, 182, 71, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(214, 182, 71, 0.05) 1px, transparent 1px),
          linear-gradient(135deg, #fff9dc 0%, #fff1b8 35%, #fdf2d5 100%);
        background-size: 28px 28px, 28px 28px, 100% 100%;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      .box {
        width: min(90vw, 430px);
        background: rgba(255, 255, 255, 0.78);
        border: 2px solid #efd88b;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(150, 128, 50, 0.12), inset 0 0 0 2px rgba(255,255,255,0.5);
        padding: 32px 26px 22px;
        position: relative;
      }

      .box::before {
        content: "";
        position: absolute;
        inset: 10px 12px 10px 12px;
        border: 1px solid rgba(188, 153, 70, 0.3);
        border-radius: 12px;
        pointer-events: none;
      }

      h1 {
        text-align: center;
        font-size: 2rem;
        color: #7a6729;
        margin: 0 0 24px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
        color: #7a6729;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border-radius: 10px;
        border: 2px solid #f2d778;
        background: #fffdf5;
        font-size: 1rem;
        margin-bottom: 18px;
        outline: none;
      }

      input:focus {
        border-color: #e7c65a;
        box-shadow: 0 0 0 4px rgba(231, 198, 90, 0.18);
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #f7e7a1, #f3d76f);
        color: #655123;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 18px rgba(214, 182, 71, 0.22);
      }

      button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 420px) {
        body { padding: 12px; }
        .box { width: 100%; padding: 28px 18px 20px; }
        h1 { font-size: 1.7rem; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Crear cuenta</h1>

      <form id="registerForm">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" placeholder="correo@ejemplo.com" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••" required />

        <label for="centro">Centro de Estudios</label>
        <input id="centro" type="text" placeholder="Nombre de tu centro educativo" required />

        <label for="curso">Curso</label>
        <input id="curso" type="text" placeholder="Ej: 3º ESO, 1º Bachillerato" required />

        <button type="submit">Registrarme</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script>

      const registerForm = document.getElementById('registerForm');

      registerForm.addEventListener('submit', async function (event) {
        event.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const centro_estudios = document.getElementById('centro').value.trim();
        const curso = document.getElementById('curso').value.trim();

        if (!email || !password || !centro_estudios || !curso) {
          showNotification('Completa todos los campos.', 'error');
          return;
        }

        if (password.length < 6) {
          showNotification('La contraseña debe tener al menos 6 caracteres.', 'error');
          return;
        }

        try {
          const { data, error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
              data: { centro_estudios, curso },
              emailRedirectTo: new URL('verificar_correo.html', window.location.href).href
            }
          });

          if (error) throw error;
          if (!data.user) throw new Error('Supabase no devolvió el usuario creado.');
          if (data.user.identities && data.user.identities.length === 0) {
            throw new Error('Ya existe una cuenta con ese correo. Inicia sesión o verifica el correo recibido.');
          }

          let { error: profileError } = await supabaseClient.rpc('crear_perfil_registro', {
            p_email: email,
            p_centro_estudios: centro_estudios,
            p_curso: curso,
            p_email_verificado: Boolean(data.session)
          });
          if (profileError?.code === 'PGRST202') {
            const fallback = await supabaseClient.from('usuarios').insert({
              email,
              centro_estudios,
              curso,
              rango: 'usuario',
              email_verificado: Boolean(data.session)
            });
            profileError = fallback.error;
          }
          if (profileError && profileError.code !== '23505') throw profileError;
          showNotification(data.session ? 'Cuenta creada correctamente.' : 'Te hemos enviado un enlace de verificación por correo.', 'success');
          window.location.href = data.session ? 'inicio.html' : 'verificar_correo.html?email=' + encodeURIComponent(email);
        } catch (error) {
          const message = error.message || '';
          if (message.toLowerCase().includes('database error saving new user')) {
            showNotification('Hay un trigger de perfiles bloqueando el registro. Ejecuta inutiles/reparar-perfil-auth.sql y comprueba que no quede ningún trigger personalizado en auth.users.', 'error');
          } else if (message.toLowerCase().includes('redirect')) {
            showNotification('Añade la URL de esta página en Supabase > Authentication > URL Configuration.', 'error');
          } else if (message.toLowerCase().includes('rate limit')) {
            showNotification('Supabase ha limitado temporalmente los correos. Espera unos minutos antes de intentarlo otra vez.', 'error');
          } else {
            showNotification(message || 'Error al registrar la cuenta.', 'error');
          }
        }
      });
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
