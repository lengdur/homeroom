<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis solicitudes</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; background: linear-gradient(135deg, #fff9dc, #eaf2ff); font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #243746; }
      .container { width: min(94vw, 800px); margin: 0 auto; padding: 34px; background: rgba(255,255,255,.9); border: 2px solid #d7e2e9; border-radius: 14px; box-shadow: 0 16px 35px rgba(50,70,80,.14); }
      .back { display: inline-block; margin-bottom: 18px; color: #286675; font-weight: 700; }
      h1 { margin: 0 0 8px; color: #285b68; }
      .subtitle { margin: 0 0 26px; color: #607581; }
      .request-group + .request-group { margin-top: 28px; }
      .request-group h2 { margin: 0 0 12px; color: #285b68; font-size: 1.25rem; }
      .request-list { display: grid; gap: 12px; }
      .request { padding: 16px; border: 1px solid #d9e7e9; border-radius: 10px; background: #f8fcfc; }
      .request h3 { margin: 0 0 8px; color: #285b68; font-size: 1.05rem; }
      .request p { margin: 6px 0; line-height: 1.45; }
      .file-link { display: inline-block; margin-top: 8px; color: #286675; font-weight: 700; }
      .empty { color: #72828a; }
      @media (max-width: 560px) { body { padding: 12px; } .container { padding: 24px 18px; } }
    </style>
  </head>
  <body>
    <main class="container">
      <a class="back" href="inicio.html">← Volver al inicio</a>
      <h1>Mis solicitudes</h1>
      <p class="subtitle">Tus solicitudes ordenadas de más reciente a más antigua.</p>
      <div id="requestsContent"><p class="empty">Cargando solicitudes...</p></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      const requestsContent = document.getElementById('requestsContent');

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
      }

      async function loadRequests() {
        const user = await requireUser();
        if (!user) return;

        const { data, error } = await supabaseClient
          .from('solicitudes')
          .select('*')
          .eq('email', user.email)
          .order('created_at', { ascending: false });

        if (error) throw error;
        if (!data || !data.length) {
          requestsContent.innerHTML = '<p class="empty">Aún no tienes solicitudes.</p>';
          return;
        }

        const entries = await Promise.all(data.map(async request => {
          const fileUrl = request.archivo_url ? await getSignedStorageUrl(request.archivo_url) : '';
          const typeLabel = request.tipo === 'exposicion' ? 'Esquema' : 'Apunte';
          return `
            <article class="request">
              <h3>${escapeHtml(request.tema || 'Sin tema')} · ${typeLabel}</h3>
              <p><strong>Páginas:</strong> ${escapeHtml(request.paginas || '—')}</p>
              <p><strong>Descripción:</strong> ${escapeHtml(request.descripcion || 'Sin descripción')}</p>
              <p><strong>Fecha:</strong> ${escapeHtml(new Date(request.created_at).toLocaleString('es-ES'))}</p>
              ${fileUrl ? '<a class="file-link" href="' + fileUrl + '" target="_blank" rel="noopener">Ver archivo</a>' : '<p class="empty">Archivo pendiente.</p>'}
            </article>
          `;
        }));

        const activeEntries = entries.filter((entry, index) => (data[index].estado || 'en_curso') !== 'completada');
        const completedEntries = entries.filter((entry, index) => data[index].estado === 'completada');
        requestsContent.innerHTML = `
          <section class="request-group">
            <h2>En curso</h2>
            <div class="request-list">${activeEntries.join('') || '<p class="empty">No tienes solicitudes en curso.</p>'}</div>
          </section>
          <section class="request-group">
            <h2>Completadas</h2>
            <div class="request-list">${completedEntries.join('') || '<p class="empty">No tienes solicitudes completadas.</p>'}</div>
          </section>
        `;
      }

      loadRequests().catch(error => {
        requestsContent.innerHTML = '<p class="empty">No se pudieron cargar tus solicitudes.</p>';
        console.error(error);
      });
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
