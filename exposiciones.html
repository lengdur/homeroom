<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Esquemas</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(120, 170, 130, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 170, 130, 0.06) 1px, transparent 1px),
          linear-gradient(135deg, #f4fbf5 0%, #ebf9ed 30%, #e1f4e4 100%);
        background-size: 28px 28px, 28px 28px, 100% 100%;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      .container {
        width: min(90vw, 980px);
        background: rgba(255, 255, 255, 0.55);
        border: 2px solid #beddb7;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(86, 126, 87, 0.12), inset 0 0 0 2px rgba(255,255,255,0.6);
        padding: 28px 22px;
        position: relative;
      }

      .btn-inicio {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 10px;
        background: linear-gradient(135deg, #dff7e2, #bfe7c9);
        border: 2px solid rgba(108, 165, 123, 0.7);
        color: #285c33;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(90, 140, 98, 0.12);
      }

      .container::before {
        content: "";
        position: absolute;
        inset: 10px 12px;
        border: 1px solid rgba(123, 166, 126, 0.4);
        border-radius: 12px;
        pointer-events: none;
      }

      h1 {
        text-align: center;
        color: #3d7244;
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 0 0 26px;
      }

      .grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(130px, 1fr));
        gap: 22px;
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #285c33;
        aspect-ratio: 1.4 / 1;
        border-radius: 18px;
        background: linear-gradient(135deg, #dff7e2, #bfe7c9);
        border: 2px solid rgba(108, 165, 123, 0.7);
        box-shadow: 0 10px 18px rgba(90, 140, 98, 0.12);
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.4rem);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        text-align: center;
        padding: 16px;
        overflow: hidden;
      }

      .card.has-preview {
        color: white;
      }

      .card.has-preview::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(38, 94, 53, 0.72), rgba(18, 64, 38, 0.52));
        z-index: 0;
      }

      .card-preview {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: saturate(1.1) contrast(1.04) brightness(0.75);
        z-index: 0;
      }

      .card-preview.file-fallback {
        display: grid;
        place-items: center;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        background: linear-gradient(135deg, rgba(49, 117, 73, 0.85), rgba(34, 89, 50, 0.68));
        color: white;
      }

      .card-description {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 9px;
        border-radius: 8px;
        background: rgba(40, 92, 51, 0.92);
        color: white;
        font-size: 0.78rem;
        line-height: 1.25;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
      }

      .card:hover .card-description,
      .card:focus-visible .card-description {
        opacity: 1;
        transform: translateY(0);
      }

      .card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 14px 24px rgba(90, 140, 98, 0.18);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(3, minmax(130px, 1fr));
        }
      }

      @media (max-width: 620px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .container { width: min(94vw, 420px); padding: 24px 16px; }
        .btn-inicio { position: static; margin-bottom: 12px; }
      }

      .floating-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        padding: 14px 28px;
        background: linear-gradient(135deg, #6fb97f, #4fa368);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(75, 163, 104, 0.3);
        transition: all 0.3s ease;
      }

      .floating-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(75, 163, 104, 0.4);
      }

      .floating-btn:active {
        transform: translateY(-1px);
      }

      .request-history {
        margin-top: 28px;
        background: rgba(255, 255, 255, 0.72);
        border: 2px solid rgba(108, 165, 123, 0.35);
        border-radius: 16px;
        padding: 20px;
      }

      .request-history h2 {
        margin: 0 0 16px;
        color: #285c33;
      }

      .request-history-list {
        display: grid;
        gap: 12px;
      }

      .request-group + .request-group {
        margin-top: 24px;
      }

      .request-group h3 {
        margin: 0 0 10px;
        color: #2f5d3b;
        font-size: 1rem;
      }

      .request-entry {
        padding: 12px 14px;
        border-radius: 10px;
        background: #eefaf0;
        border: 1px solid #d0ebd6;
      }

      .request-entry strong {
        color: #285c33;
      }

      .request-entry p {
        margin: 6px 0;
        color: #2f5d3b;
      }

      .request-entry .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        background: #dff7e2;
        color: #285c33;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(25, 50, 31, 0.45);
      }

      .modal.visible { display: grid; }

      .modal-content {
        width: min(94vw, 520px);
        padding: 28px;
        border-radius: 14px;
        background: white;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }

      .modal h2 { margin: 0 0 22px; color: #285c33; }
      .modal label { display: block; margin: 14px 0 6px; color: #285c33; font-weight: 700; }
      .modal input, .modal select, .modal textarea { width: 100%; padding: 11px; border: 2px solid #c5dfc9; border-radius: 8px; font: inherit; }
      .modal textarea { min-height: 100px; resize: vertical; }
      .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
      .modal-actions button { flex: 1; padding: 12px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
      .submit-request { background: #4f9660; color: white; }
      .cancel-request { background: #e1eee3; color: #285c33; }

      @media (max-width: 620px) {
        .floating-btn {
          bottom: 16px;
          right: 16px;
          padding: 12px 20px;
          font-size: 14px;
        }

        .modal-actions { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <a class="btn-inicio" href="inicio.html">← Inicio</a>

    <div class="container">
      <h1>Esquemas</h1>

      <div class="grid" id="exposicionesGrid">
        <p>Cargando esquemas...</p>
      </div>

      <div class="request-history" id="userRequestsHistory" aria-live="polite"></div>
    </div>

    <button class="floating-btn" type="button" onclick="openRequestModal()">📬 Solicitar esquemas</button>

    <div id="requestModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="requestTitle">
      <form id="requestForm" class="modal-content">
        <h2 id="requestTitle">Solicitar esquemas</h2>
        <label for="requestTheme">Tema</label>
        <select id="requestTheme" required>
          <option value="">Selecciona un tema...</option>
          <option>Mates</option>
          <option>Lengua</option>
          <option>Historia</option>
          <option>Biología/Geología</option>
          <option>Física/Química</option>
        </select>
        <label for="requestPages">Punto del tema</label>
        <input id="requestPages" type="number" min="1" max="30" required />
        <label for="requestDescription">Breve descripción</label>
        <textarea id="requestDescription" maxlength="500" required></textarea>
        <div class="modal-actions">
          <button class="cancel-request" type="button" onclick="closeRequestModal()">Cancelar</button>
          <button class="submit-request" type="submit">Enviar solicitud</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script>
      async function loadExposiciones() {
        const grid = document.getElementById('exposicionesGrid');
        try {
          const user = await requireUser();
          if (!user) return;
          const { data: exposiciones, error } = await supabaseClient.from('exposiciones').select('*').order('posicion');
          if (error) throw error;

          grid.innerHTML = '';
          if (!exposiciones.length) {
            grid.innerHTML = '<p>No hay esquemas disponibles.</p>';
            return;
          }

          for (const exposicion of exposiciones) {
            const card = document.createElement('a');
            card.className = 'card';
            const fileUrl = exposicion.archivo_url ? await getSignedStorageUrl(exposicion.archivo_url) : '';
            card.href = fileUrl || '#';
            card.target = exposicion.archivo_url ? '_blank' : '_self';

            if (fileUrl) {
              const isImage = /\.(png|jpe?g|gif|webp|bmp|svg|avif)$/i.test(String(exposicion.archivo_url));
              const preview = document.createElement('div');
              preview.className = isImage ? 'card-preview' : 'card-preview file-fallback';

              if (isImage) {
                preview.style.backgroundImage = "url('" + fileUrl + "')";
              } else {
                const ext = String(exposicion.archivo_url).split('?')[0].split('/').pop() || 'archivo';
                preview.textContent = ext.includes('.') ? ext.split('.').pop().toUpperCase() : 'FILE';
              }
              card.appendChild(preview);
              card.classList.add('has-preview');
            }

            const title = document.createElement('span');
            title.textContent = exposicion.titulo;
            const description = document.createElement('span');
            description.className = 'card-description';
            description.textContent = exposicion.contenido || 'Sin descripción disponible.';
            card.append(title, description);
            grid.appendChild(card);
          }
        } catch (error) {
          grid.innerHTML = '<p>No se pudieron cargar los esquemas.</p>';
          console.error(error);
        }
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>\"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', "'": '&#039;' })[character]);
      }

      async function loadUserRequestsHistory() {
        const container = document.getElementById('userRequestsHistory');
        const user = await requireUser();
        if (!user) return;

        const { data, error } = await supabaseClient
          .from('solicitudes')
          .select('*')
          .eq('email', user.email)
          .eq('tipo', 'exposicion')
          .order('created_at', { ascending: false });

        if (error) {
          container.innerHTML = '<h2>Solicitudes previas</h2><p>No se pudieron cargar tus solicitudes.</p>';
          return;
        }

        if (!data || !data.length) {
          container.innerHTML = '<h2>Solicitudes previas</h2><p>Aún no tienes solicitudes de esquemas.</p>';
          return;
        }

        const entries = await Promise.all(data.map(async request => {
          const fileUrl = request.archivo_url ? await getSignedStorageUrl(request.archivo_url) : '';
          return `
            <div class="request-entry">
              <strong>${escapeHtml(request.tema || 'Sin tema')}</strong>
              <p>Páginas: ${escapeHtml(request.paginas || '—')}</p>
              <p>Descripción: ${escapeHtml(request.descripcion || 'Sin descripción')}</p>
              ${fileUrl ? '<p><a href="' + fileUrl + '" target="_blank" rel="noopener">Ver archivo</a></p>' : '<p>Archivo pendiente.</p>'}
            </div>
          `;
        }));

        const activeEntries = entries.filter((entry, index) => (data[index].estado || 'en_curso') !== 'completada');
        const completedEntries = entries.filter((entry, index) => data[index].estado === 'completada');
        container.innerHTML = '<h2>Solicitudes previas</h2>'
          + '<section class="request-group"><h3>En curso</h3><div class="request-history-list">'
          + (activeEntries.join('') || '<p>No tienes solicitudes en curso.</p>')
          + '</div></section>'
          + '<section class="request-group"><h3>Completadas</h3><div class="request-history-list">'
          + (completedEntries.join('') || '<p>No tienes solicitudes completadas.</p>')
          + '</div></section>';
      }

      loadExposiciones();
      loadUserRequestsHistory();

      const requestModal = document.getElementById('requestModal');
      const requestForm = document.getElementById('requestForm');

      function openRequestModal() { requestModal.classList.add('visible'); }
      function closeRequestModal() { requestModal.classList.remove('visible'); requestForm.reset(); }

      requestForm.addEventListener('submit', async event => {
        event.preventDefault();
        const user = await requireUser();
        if (!user) return;
        const { error } = await supabaseClient.from('solicitudes').insert({
            email: user.email,
            tipo: 'exposicion',
            tema: document.getElementById('requestTheme').value,
            paginas: document.getElementById('requestPages').value,
            descripcion: document.getElementById('requestDescription').value
        });
        if (error) { showNotification(error.message || 'No se pudo enviar la solicitud.', 'error'); return; }
        closeRequestModal();
        showNotification('Solicitud enviada correctamente.', 'success');
      });
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
