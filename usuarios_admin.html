<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | Administración</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; background: linear-gradient(135deg, #edf7f6, #d8eaf0); font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #243746; }
      .container { width: min(96vw, 1180px); margin: 0 auto; padding: 30px; background: rgba(255, 255, 255, .94); border: 2px solid #9dc9cf; border-radius: 16px; box-shadow: 0 16px 40px rgba(35, 67, 80, .16); }
      .back { display: inline-block; margin-bottom: 16px; color: #286675; font-weight: 700; }
      h1 { margin: 0; color: #285b68; }
      .subtitle { margin: 8px 0 24px; color: #607581; }
      .toolbar { display: grid; grid-template-columns: minmax(220px, 2fr) repeat(2, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
      label { display: flex; flex-direction: column; gap: 6px; color: #286675; font-weight: 700; }
      input, select { width: 100%; padding: 11px 12px; border: 1px solid #a9c8cc; border-radius: 7px; background: white; color: #243746; font: inherit; }
      .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
      .summary span { padding: 8px 12px; border-radius: 999px; background: #e1f0f1; color: #286675; font-weight: 700; }
      .table-wrap { overflow-x: auto; border: 1px solid #c8dde0; border-radius: 10px; }
      table { width: 100%; border-collapse: collapse; min-width: 700px; }
      th, td { padding: 13px 14px; border-bottom: 1px solid #e1edef; text-align: left; }
      th { background: #f1f8f8; color: #286675; font-size: .9rem; }
      tr:last-child td { border-bottom: 0; }
      .email { color: #285b68; font-weight: 700; }
      .role { color: #607581; font-size: .9rem; }
      .presence { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
      .presence::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #a9b7bc; }
      .presence.online { color: #2f8752; }
      .presence.online::before { background: #35ad62; box-shadow: 0 0 0 3px rgba(53, 173, 98, .14); }
      .empty { padding: 24px; color: #607581; text-align: center; }
      @media (max-width: 760px) { body { padding: 12px; } .container { padding: 22px 16px; } .toolbar { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="container">
      <a class="back" href="admin.html">← Volver al panel admin</a>
      <h1>Usuarios</h1>
      <p class="subtitle">Directorio ordenado por instituto, curso y correo. La presencia se actualiza en tiempo real.</p>

      <section class="toolbar" aria-label="Filtros de usuarios">
        <label>Buscar<input id="searchInput" type="search" placeholder="Correo, instituto o curso" /></label>
        <label>Instituto<select id="instituteFilter"><option value="">Todos los institutos</option></select></label>
        <label>Curso<select id="courseFilter"><option value="">Todos los cursos</option></select></label>
      </section>

      <div class="summary" aria-live="polite">
        <span id="totalCount">0 usuarios</span>
        <span id="onlineCount">0 conectados</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Instituto</th><th>Curso</th><th>Correo</th><th>Rango</th><th>Estado</th></tr></thead>
          <tbody id="usersBody"><tr><td class="empty" colspan="5">Cargando usuarios...</td></tr></tbody>
        </table>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
      const usersBody = document.getElementById('usersBody');
      const searchInput = document.getElementById('searchInput');
      const instituteFilter = document.getElementById('instituteFilter');
      const courseFilter = document.getElementById('courseFilter');
      const totalCount = document.getElementById('totalCount');
      const onlineCount = document.getElementById('onlineCount');
      let users = [];
      let onlineEmails = new Set();
      let presenceChannel;

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
      }

      function normalize(value) {
        return String(value ?? '').trim().toLocaleLowerCase('es');
      }

      function compareText(first, second) {
        return String(first ?? '').localeCompare(String(second ?? ''), 'es', { sensitivity: 'base' });
      }

      function compareCourse(first, second) {
        const firstText = normalize(first);
        const secondText = normalize(second);
        const firstNumber = Number((firstText.match(/\d+/) || [])[0]);
        const secondNumber = Number((secondText.match(/\d+/) || [])[0]);
        if (Number.isFinite(firstNumber) && Number.isFinite(secondNumber) && firstNumber !== secondNumber) return firstNumber - secondNumber;
        return compareText(first, second);
      }

      function isOnline(user) {
        return onlineEmails.has(normalize(user.email));
      }

      function renderFilters() {
        const institutes = [...new Set(users.map(user => user.centro_estudios).filter(Boolean))].sort(compareText);
        const courses = [...new Set(users.map(user => user.curso).filter(Boolean))].sort(compareCourse);
        instituteFilter.innerHTML = '<option value="">Todos los institutos</option>' + institutes.map(value => '<option>' + escapeHtml(value) + '</option>').join('');
        courseFilter.innerHTML = '<option value="">Todos los cursos</option>' + courses.map(value => '<option>' + escapeHtml(value) + '</option>').join('');
      }

      function renderUsers() {
        const search = normalize(searchInput.value);
        const institute = instituteFilter.value;
        const course = courseFilter.value;
        const visibleUsers = users
          .filter(user => !institute || user.centro_estudios === institute)
          .filter(user => !course || user.curso === course)
          .filter(user => !search || [user.email, user.centro_estudios, user.curso, user.rango].some(value => normalize(value).includes(search)))
          .sort((first, second) => compareText(first.centro_estudios, second.centro_estudios) || compareCourse(first.curso, second.curso) || compareText(first.email, second.email));

        totalCount.textContent = visibleUsers.length + (visibleUsers.length === 1 ? ' usuario' : ' usuarios');
        onlineCount.textContent = users.filter(isOnline).length + ' conectados';
        usersBody.innerHTML = visibleUsers.length ? visibleUsers.map(user => {
          const online = isOnline(user);
          return '<tr><td>' + escapeHtml(user.centro_estudios || 'Sin instituto') + '</td><td>' + escapeHtml(user.curso || 'Sin curso') + '</td><td class="email">' + escapeHtml(user.email) + '</td><td class="role">' + escapeHtml(user.rango || 'usuario') + '</td><td><span class="presence ' + (online ? 'online' : '') + '">' + (online ? 'Conectado' : 'Desconectado') + '</span></td></tr>';
        }).join('') : '<tr><td class="empty" colspan="5">No hay usuarios que coincidan con la búsqueda.</td></tr>';
      }

      function updatePresence(state) {
        onlineEmails = new Set(Object.values(state || {}).flat().map(entry => normalize(entry.email)).filter(Boolean));
        renderUsers();
      }

      async function startAdminPresence() {
        presenceChannel = supabaseClient.channel('usuarios-online', { config: { presence: { key: 'admin-' + crypto.randomUUID() } } });
        presenceChannel.on('presence', { event: 'sync' }, () => updatePresence(presenceChannel.presenceState()));
        presenceChannel.on('presence', { event: 'join' }, () => updatePresence(presenceChannel.presenceState()));
        presenceChannel.on('presence', { event: 'leave' }, () => updatePresence(presenceChannel.presenceState()));
        await new Promise((resolve, reject) => {
          presenceChannel.subscribe(status => status === 'SUBSCRIBED' ? resolve() : status === 'CHANNEL_ERROR' ? reject(new Error('No se pudo conectar al estado de presencia.')) : null);
        });
      }

      async function loadUsers() {
        const { data, error } = await supabaseClient.from('usuarios').select('email, centro_estudios, curso, rango');
        if (error) throw error;
        users = data || [];
        renderFilters();
        renderUsers();
      }

      [searchInput, instituteFilter, courseFilter].forEach(control => control.addEventListener('input', renderUsers));

      (async () => {
        try {
          const profile = await requireAdmin();
          if (!profile) return;
          await Promise.all([loadUsers(), startAdminPresence()]);
        } catch (error) {
          usersBody.innerHTML = '<tr><td class="empty" colspan="5">No se pudieron cargar los usuarios.</td></tr>';
          console.error(error);
        }
      })();
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
