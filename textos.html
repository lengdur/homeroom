<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textos</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(150, 180, 240, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(150, 180, 240, 0.05) 1px, transparent 1px),
          linear-gradient(135deg, #eef6ff 0%, #eaf2ff 28%, #dfeeff 100%);
        background-size: 28px 28px, 28px 28px, 100% 100%;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      }

      .container {
        width: min(90vw, 980px);
        background: rgba(255, 255, 255, 0.55);
        border: 2px solid #bfd4f7;
        border-radius: 18px;
        box-shadow: 0 12px 28px rgba(90, 112, 163, 0.12), inset 0 0 0 2px rgba(255,255,255,0.6);
        padding: 28px 22px;
        position: relative;
      }

      .btn-inicio {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 10px;
        background: linear-gradient(135deg, #dfeeff, #cfe0ff);
        border: 2px solid rgba(115, 150, 215, 0.7);
        color: #264c7a;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 8px 18px rgba(93, 127, 178, 0.12);
      }

      .container::before {
        content: "";
        position: absolute;
        inset: 10px 12px;
        border: 1px solid rgba(126, 153, 210, 0.4);
        border-radius: 12px;
        pointer-events: none;
      }

      h1 {
        text-align: center;
        color: #3d5d8d;
        font-size: clamp(2rem, 4vw, 2.8rem);
        margin: 0 0 26px;
      }

      .grid {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 20px;
      }

      .card {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #264c7a;
        min-height: 240px;
        width: 100%;
        border-radius: 15px;
        background: linear-gradient(135deg, #dfeeff, #cfe0ff);
        border: 2px solid rgba(115, 150, 215, 0.7);
        box-shadow: 0 10px 18px rgba(93, 127, 178, 0.12);
        font-weight: 700;
        font-size: clamp(1rem, 2vw, 1.4rem);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        text-align: center;
        padding: 16px;
        writing-mode: vertical-rl;
        text-orientation: mixed;
      }

      .card span {
        writing-mode: horizontal-tb;
        display: inline-block;
      }

      .card-description {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 9px;
        border-radius: 8px;
        background: rgba(38, 76, 122, 0.92);
        color: white;
        font-size: 0.78rem;
        line-height: 1.25;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        writing-mode: horizontal-tb;
      }

      .card:hover .card-description,
      .card:focus-visible .card-description {
        opacity: 1;
        transform: translateY(0);
      }

      .card:hover {
        transform: translateY(-6px) scale(1.02);
        box-shadow: 0 14px 24px rgba(93, 127, 178, 0.18);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(3, minmax(140px, 1fr));
        }
      }

      @media (max-width: 620px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .container { width: min(94vw, 420px); padding: 24px 16px; }
        .btn-inicio { position: static; margin-bottom: 12px; }
        .modal-actions { flex-direction: column; }
      }

      .floating-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        padding: 14px 28px;
        background: linear-gradient(135deg, #667eea, #5568d3);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        transition: all 0.3s ease;
      }

      .floating-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
      }

      .floating-btn:active {
        transform: translateY(-1px);
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: none;
        place-items: center;
        padding: 20px;
        background: rgba(25, 42, 65, 0.45);
      }

      .modal.visible { display: grid; }

      .modal-content {
        width: min(94vw, 520px);
        padding: 28px;
        border-radius: 14px;
        background: white;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
      }

      .modal h2 { margin: 0 0 22px; color: #264c7a; }
      .modal label { display: block; margin: 14px 0 6px; color: #264c7a; font-weight: 700; }
      .modal input, .modal select, .modal textarea { width: 100%; padding: 11px; border: 2px solid #bfd4f7; border-radius: 8px; font: inherit; }
      .modal textarea { min-height: 100px; resize: vertical; }
      .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
      .modal-actions button { flex: 1; padding: 12px; border: 0; border-radius: 8px; font: inherit; font-weight: 700; cursor: pointer; }
      .submit-request { background: #5568d3; color: white; }
      .cancel-request { background: #e2ebfa; color: #264c7a; }

      @media (max-width: 620px) {
        .floating-btn {
          bottom: 16px;
          right: 16px;
          padding: 12px 20px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <a class="btn-inicio" href="inicio.html">← Inicio</a>

    <div class="container">
      <h1>Textos</h1>

      <div class="grid" id="textsGrid">
        <!-- Se cargará dinámicamente desde la API -->
      </div>
    </div>

    <button class="floating-btn" type="button" onclick="openRequestModal()">📬 Solicitar texto</button>

    <div id="requestModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="requestTitle">
      <form id="requestForm" class="modal-content">
        <h2 id="requestTitle">Solicitar texto</h2>
        <label for="requestTheme">Tema</label>
        <select id="requestTheme" required>
          <option value="">Selecciona un tema...</option>
          <option>Mates</option>
          <option>Lengua</option>
          <option>Historia</option>
          <option>Biología/Geología</option>
          <option>Física/Química</option>
        </select>
        <label for="requestPages">Número de palabras (aprox)</label>
        <input id="requestPages" type="number" min="1" max="1000" required />
        <label for="requestDescription">Breve descripción</label>
        <textarea id="requestDescription" maxlength="500" required></textarea>
        <div class="modal-actions">
          <button class="cancel-request" type="button" onclick="closeRequestModal()">Cancelar</button>
          <button class="submit-request" type="submit">Enviar solicitud</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script>

      async function loadTextos() {
        try {
          const user = await requireUser();
          if (!user) return;
          const { data: textos, error } = await supabaseClient.from('textos').select('*').order('posicion');
          if (error) throw error;

          const grid = document.getElementById('textsGrid');
          grid.innerHTML = '';

          if (textos && textos.length > 0) {
            textos.forEach(texto => {
              const card = document.createElement('a');
              card.className = 'card';
              const fileUrl = texto.archivo_url ? supabaseClient.storage.from('archivos').getPublicUrl(texto.archivo_url).data.publicUrl : '';
              card.href = fileUrl || '#';
              card.target = texto.archivo_url ? '_blank' : '_self';
              const title = document.createElement('span');
              title.textContent = texto.titulo;
              const description = document.createElement('span');
              description.className = 'card-description';
              description.textContent = texto.contenido || 'Sin descripción disponible.';
              card.append(title, description);
              grid.appendChild(card);
            });
          } else {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">No hay textos disponibles</p>';
          }
        } catch (err) {
          console.error('❌ Error al cargar textos:', err);
          document.getElementById('textsGrid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">Error al cargar textos</p>';
        }
      }

      // Esperar a que el DOM esté listo
      setTimeout(() => {
        loadTextos();
      }, 100);

      const requestModal = document.getElementById('requestModal');
      const requestForm = document.getElementById('requestForm');

      function openRequestModal() { requestModal.classList.add('visible'); }
      function closeRequestModal() { requestModal.classList.remove('visible'); requestForm.reset(); }

      requestForm.addEventListener('submit', async event => {
        event.preventDefault();
        const user = await requireUser();
        if (!user) return;
        const { error } = await supabaseClient.from('solicitudes').insert({
          email: user.email,
          tipo: 'texto',
          tema: document.getElementById('requestTheme').value,
          paginas: document.getElementById('requestPages').value,
          descripcion: document.getElementById('requestDescription').value
        });
        if (error) { showNotification(error.message || 'No se pudo enviar la solicitud.', 'error'); return; }
        closeRequestModal();
        showNotification('Solicitud enviada correctamente.', 'success');
      });
    </script>
  </body>
</html>
