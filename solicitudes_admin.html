<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitudes</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 24px; background: linear-gradient(135deg, #edf7f6, #d8eaf0); font-family: "Trebuchet MS", "Segoe UI", sans-serif; color: #243746; }
      .container { width: min(94vw, 900px); margin: 0 auto; padding: 34px; background: white; border-radius: 12px; box-shadow: 0 16px 40px rgba(35, 67, 80, .18); }
      .back { display: inline-block; margin-bottom: 18px; color: #286675; font-weight: 700; }
      h1 { margin: 0 0 8px; color: #285b68; }
      .subtitle { margin: 0 0 26px; color: #607581; }
      .request { padding: 20px 0; border-top: 1px solid #d9e7e9; }
      .request:first-child { border-top: 0; }
      .request-group + .request-group { margin-top: 28px; }
      .request-group h2 { margin: 0 0 12px; color: #285b68; font-size: 1.3rem; }
      .request-group-list { display: grid; }
      .request h2 { margin: 0 0 8px; color: #285b68; font-size: 1.2rem; }
      .request p { margin: 7px 0; line-height: 1.45; }
      .date { color: #6c7f87; font-size: .9rem; }
      .upload { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
      .upload input { max-width: 280px; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; background: #3f8992; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      .file-link { color: #286675; font-weight: 700; }
      .status-button { margin-top: 14px; background: #5b9b69; }
      .status-button.reopen { background: #8a9aa2; }
      .empty { color: #607581; }
      @media (max-width: 560px) {
        body { padding: 12px; }
        .container { padding: 24px 18px; }
        .upload { align-items: stretch; flex-direction: column; }
        .upload input, .upload button { max-width: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <a class="back" href="admin.html">← Volver al panel admin</a>
      <h1>Solicitudes</h1>
      <p class="subtitle">Ordenadas de más reciente a más antigua y separadas por estado.</p>
      <section id="requestsList"></section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="notificaciones.js"></script>
    <script>
      requireAdmin();

      const list = document.getElementById('requestsList');

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[character]);
      }

      const tipoLabels = {
        texto: 'Apunte',
        exposicion: 'Esquema',
        apunte: 'Apunte',
        esquema: 'Esquema'
      };

      async function loadRequests() {
        const { data, error } = await supabaseClient.from('solicitudes').select('*').order('created_at', { ascending: false });
        if (error) { list.innerHTML = '<p class="empty">' + escapeHtml(error.message) + '</p>'; return; }
        if (!data.length) { list.innerHTML = '<p class="empty">No hay solicitudes todavía.</p>'; return; }

        const activeRequests = data.filter(request => (request.estado || 'en_curso') !== 'completada');
        const completedRequests = data.filter(request => request.estado === 'completada');
        list.innerHTML = '';

        const activeSection = document.createElement('section');
        activeSection.className = 'request-group';
        activeSection.innerHTML = '<h2>En curso</h2><div class="request-group-list"></div>';
        list.appendChild(activeSection);

        const completedSection = document.createElement('section');
        completedSection.className = 'request-group';
        completedSection.innerHTML = '<h2>Completadas</h2><div class="request-group-list"></div>';
        list.appendChild(completedSection);

        await renderRequestGroup(activeRequests, activeSection.querySelector('.request-group-list'));
        await renderRequestGroup(completedRequests, completedSection.querySelector('.request-group-list'));

        if (!activeRequests.length) activeSection.querySelector('.request-group-list').innerHTML = '<p class="empty">No hay solicitudes en curso.</p>';
        if (!completedRequests.length) completedSection.querySelector('.request-group-list').innerHTML = '<p class="empty">No hay solicitudes completadas.</p>';

        document.querySelectorAll('.upload').forEach(form => form.addEventListener('submit', uploadFile));
        document.querySelectorAll('[data-status-id]').forEach(button => button.addEventListener('click', updateStatus));
      }

      async function renderRequestGroup(requests, group) {
        for (const request of requests) {
          const item = document.createElement('article');
          item.className = 'request';
          const tipoNombre = tipoLabels[request.tipo] || request.tipo || 'Solicitud';
          const fileUrl = request.archivo_url ? await getSignedStorageUrl(request.archivo_url) : '';
          item.innerHTML = '<h2>' + escapeHtml(request.tema) + ' · ' + escapeHtml(tipoNombre) + '</h2>'
            + '<p><strong>Usuario:</strong> ' + escapeHtml(request.email) + '</p>'
            + '<p><strong>Páginas:</strong> ' + escapeHtml(request.paginas) + '</p>'
            + '<p><strong>Descripción:</strong> ' + escapeHtml(request.descripcion) + '</p>'
            + '<p class="date">' + new Date(request.created_at).toLocaleString('es-ES') + '</p>'
            + '<p><strong>Estado:</strong> ' + (request.estado === 'completada' ? 'Completada' : 'En curso') + '</p>'
            + (fileUrl ? '<a class="file-link" href="' + fileUrl + '" target="_blank" rel="noopener">Ver archivo enviado</a>' : '<form class="upload" data-id="' + request.id + '"><input type="file" name="archivo" required><button type="submit">Subir archivo</button></form>')
            + '<br><button class="status-button ' + (request.estado === 'completada' ? 'reopen' : '') + '" type="button" data-status-id="' + request.id + '">' + (request.estado === 'completada' ? 'Volver a poner en curso' : 'Marcar como completada') + '</button>';
          group.appendChild(item);
        }
      }

      async function uploadFile(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const file = form.querySelector('input[type="file"]').files[0];
        const button = form.querySelector('button');
        if (!file) return;

        button.disabled = true;
        try {
          const filePath = 'solicitudes/' + form.dataset.id + '/' + crypto.randomUUID() + '-' + file.name;
          const { error: uploadError } = await supabaseClient.storage.from('archivos').upload(filePath, file);
          if (uploadError) throw uploadError;

          const { error: updateError } = await supabaseClient
            .from('solicitudes')
            .update({ archivo_url: filePath, estado: 'completada' })
            .eq('id', form.dataset.id);
          if (updateError) throw updateError;

          showNotification('Archivo subido correctamente.', 'success');
          loadRequests();
        } catch (error) {
          showNotification(error.message || 'No se pudo subir el archivo.', 'error');
          button.disabled = false;
        }
      }

      async function updateStatus(event) {
        const button = event.currentTarget;
        const completed = button.classList.contains('reopen');
        const { error } = await supabaseClient.from('solicitudes').update({ estado: completed ? 'en_curso' : 'completada' }).eq('id', button.dataset.statusId);
        if (error) { showNotification(error.message || 'No se pudo actualizar el estado.', 'error'); return; }
        loadRequests();
      }

      loadRequests().catch(() => { list.innerHTML = '<p class="empty">No se pudieron cargar las solicitudes.</p>'; });
    </script>
    <script src="proteccion-interfaz.js"></script>
  </body>
</html>
